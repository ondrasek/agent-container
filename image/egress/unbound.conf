server:
  interface: 0.0.0.0
  access-control: 0.0.0.0/0 allow
  do-daemonize: no
  username: unbound
  verbosity: 1
  # log-replies makes a refusal a RECORD, not just a failure (FR-020d).
  log-replies: yes
  chroot: ""
  pidfile: "/run/unbound/unbound.pid"

  # ONE ANSWER PER NAME FOR EVERYTHING INSIDE THE BOUNDARY (T147, measured in
  # research R24). Three components resolve independently here — the agent, squid's
  # own ipcache, and the entrypoint installing `-d <name>` rules — and the boundary
  # only works when all three hold the SAME addresses. With a CDN's real TTL they
  # do not: `s3.amazonaws.com` answers with 8 addresses at TTL 5, and a fresh query
  # returns 8 different ones, so the address the agent connected to was absent from
  # the set squid resolved. squid calls that host-header forgery and answers 409 —
  # `SECURITY ALERT: Host header forgery detected` — for a DECLARED host. Measured:
  # 10 of 12 HTTPS requests to a declared `s3.amazonaws.com` failed (curl exit 35)
  # with 10 matching alerts; with this line, 0 of 12 failed and no alert appeared.
  #
  # It overrides what the zone owner asked for, deliberately and in one direction
  # only: a legitimate address change is honoured up to 300 s late, and clients
  # retry the other addresses in the set meanwhile. The alternative measured worse.
  #
  # NOT A FIX FOR THE `{host, port}` PIN. Netfilter rules are installed once, at
  # start, so this only guarantees they agree with the agent's answers while that
  # first cache entry lives; after it expires the pin can go stale again, and R24
  # records that rather than implying it was solved here.
  cache-min-ttl: 300

  # FR-020b/FR-020e. `refuse` answers REFUSED — "policy forbids asking" — where
  # dnsmasq's NXDOMAIN would say "no such name". That distinction is not
  # cosmetic: NXDOMAIN is a CACHEABLE NEGATIVE, so a client that caches it keeps
  # failing after the operator fixes the declaration, and a policy error presents
  # as a DNS bug that outlives its cause (research R16).
  local-zone: "." refuse

include: "/etc/unbound/allowed.conf"

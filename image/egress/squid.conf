# Generated-adjacent: this file is BAKED; only allowed_sni.acl varies per
# environment and arrives via compose configs `content:`.

# Squid REQUIRES at least one non-intercept forward-proxy port: it builds
# internal URLs (icons, error pages) from one, and with only intercept ports it
# renders them as `:0` and dies with `mimeLoadIcon: cannot parse internal URL`.
# Bound to loopback so it is reachable only from inside the namespace, and never
# advertised to the agent — the agent is redirected, not configured.
http_port 127.0.0.1:3127

http_port 3128 intercept
https_port 3129 name=tlsintercept intercept ssl-bump generate-host-certificates=off \
  tls-cert=/etc/squid/intercept.pem

# The allowlist. `"file"` in squid means READ THIS FILE — which is why an entry
# must never itself be quoted when generated (research R12a: a quoted entry is
# treated as a path and yields an acl with NO entries, i.e. a silently empty
# allowlist). Subdomains use a LEADING DOT here, not the `*.` form Phase A's
# tinyproxy regexes used.
acl allowed_sni ssl::server_name "/etc/squid/allowed_sni.acl"
acl step1 at_step SslBump1

# peek -> splice, NEVER bump. `peek` reads the ClientHello (and therefore the
# SNI) without completing a TLS session with the client; `splice` then hands the
# connection through untouched. `bump` would decrypt, see every Authorization
# header, and break Constitution III — it is deliberately absent, and R15 checks
# the client sees the REAL server certificate.
ssl_bump peek step1
ssl_bump splice allowed_sni
ssl_bump terminate all

# ON THE TLS INTERCEPT PORT THE DECISION BELONGS TO ssl_bump, NOT TO http_access.
# An intercepted TLS connection reaches http_access as a SYNTHESISED CONNECT to
# the destination IP — no Host header, and the ClientHello not yet peeked — so
# `dstdomain` cannot match and `deny all` fired before ssl_bump ever ran. A
# DECLARED host failed with curl exit 60 while squid logged
# `TCP_DENIED/000 CONNECT 160.79.104.10:443` (research R19c): the allowlist was
# being enforced by the one component that cannot see the hostname.
#
# THIS IS NOT A HOLE — it defers, it does not permit. `ssl_bump splice
# allowed_sni` / `terminate all` above run AFTER the peek and hold the SNI.
# Proven by isolating this from DNS: a host unbound WILL resolve but that is
# absent from this ACL is still terminated (measured, curl exit 35, no tunnel).
#
# `myportname`, NOT `localport`: on a NAT-intercepted connection squid reports
# the ORIGINAL destination port (443), so `localport 3129` never matches and the
# scoping silently becomes a no-op — measured, and it looks identical to a
# working rule from outside.
acl tls_intercept myportname tlsintercept
http_access allow tls_intercept

# Plain HTTP and the forward-proxy CONNECT carry a real hostname, so they are
# allowlisted on it here; anything else is refused with a status the client can
# report, rather than dropped (research R1a).
acl allowed_http dstdomain "/etc/squid/allowed_sni.acl"
http_access allow allowed_http
http_access deny all

cache deny all
access_log stdio:/var/log/squid/access.log
pid_filename none

# Packaging for `uv tool install --editable .` (see README "Install as a uv tool").
#
# devenv-wiz is a single PEP 723 script (bin/devenv-wiz) that also runs via
# `uv run --script`. This pyproject exposes it as an installable console script
# WITHOUT duplicating code: the sibling symlink bin/devenv_wiz.py -> devenv-wiz
# gives the hyphenated, extensionless file an importable module name, and an
# EDITABLE install path-redirects to it (no copy) so Path(__file__).resolve()
# still lands inside the repo — which is what keeps REPO_ROOT correct for
# `build`'s docker context and the `completions` command.
#
# A non-editable install would copy the module into site-packages and break
# REPO_ROOT; --editable is mandatory (documented in the README).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devenv-wiz"
version = "0.1.0"
requires-python = ">=3.11"
# Mirror the PEP 723 dependency block in bin/devenv-wiz EXACTLY — keep in sync.
dependencies = [
    "typer>=0.12,<1",
    "questionary>=2.0,<3",
    "rich>=13,<15",
]

[project.scripts]
devenv-wiz = "devenv_wiz:cli"

[tool.hatch.build.targets.wheel]
only-include = ["bin/devenv_wiz.py"]

[tool.hatch.build.targets.wheel.sources]
"bin" = ""  # install bin/devenv_wiz.py as the top-level module `devenv_wiz`

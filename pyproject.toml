# Packaging for a NON-editable install from PyPI (`uv tool install agent-container`,
# `pipx install agent-container`) as well as `uv tool install --editable .` for dev.
#
# NAMING: the project is uniformly `agent-container` — distribution, `agent-container`
# command, `agent_container` import module, and the github.com/ondrasek/agent-container
# repo all match. (The original `agent-env` was blocked by PyPI's similarity guard
# against the pre-existing `agentenv`, so the whole project was renamed for consistency.)
#
# agent-container is a single PEP 723 script (bin/agent-container) that also runs via
# `uv run --script`. The wheel ships that one file as the `agent_container` module and
# bundles the shell completions as package data (agent_container/completions/*), via a
# force-include mapping — no code is duplicated and no symlink is needed. Because
# a non-editable install copies the module out of the repo, REPO_ROOT is resolved
# location-independently at runtime (see _find_repo_root in bin/agent-container):
# client subcommands (up/down/list/attach/logs/purge/completions) work standalone,
# and `completions` falls back to the bundled package data. Only `build` needs a
# repo checkout for its docker build context — supply one via AGENT_CONTAINER_REPO or
# `--context` (documented in the README).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-container"
version = "0.9.0"
description = "Always-on containerized dev environment for AI coding agents, driven over SSH+tmux."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ondrej Krajicek", email = "ondrej.krajicek@ideastatica.com" }]
keywords = ["dev-environment", "remote-development", "docker", "podman", "tmux", "ssh", "ai-agents", "cli"]
# NOTE: no `License ::` trove classifier — the SPDX `license = "MIT"` above emits
# `License-Expression: MIT` (Metadata 2.4); under PEP 639 a license classifier
# alongside an SPDX expression is redundant/deprecated (setuptools>=78 errors).
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
# Mirror the PEP 723 dependency block in bin/agent-container EXACTLY — keep in sync.
dependencies = [
    "typer>=0.12,<1",
    "questionary>=2.0,<3",
    "rich>=13,<15",
]

[project.urls]
Homepage = "https://github.com/ondrasek/agent-container"
Repository = "https://github.com/ondrasek/agent-container"
Issues = "https://github.com/ondrasek/agent-container/issues"

[project.scripts]
agent-container = "agent_container:cli"

# Ship the single-file script as the `agent_container` module and the completion
# scripts as package data. bypass-selection is required because there is no
# conventionally-named package/module directory for hatchling to auto-detect.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"bin/agent-container" = "agent_container/__init__.py"
"completions/agent-container.bash" = "agent_container/completions/agent-container.bash"
"completions/agent-container.zsh" = "agent_container/completions/agent-container.zsh"

# Test layering (constitution Principle V — inverted pyramid): the fast,
# runtime-free unit/contract tests are the default inner loop; the real-container
# acceptance suite (bin/tests/test_acceptance.py) is the authoritative validation
# layer, opted into with `pytest -m acceptance`. `addopts` excludes it by default
# so a bare `pytest` run (and the hermetic CI job) never need a container runtime.
[tool.pytest.ini_options]
markers = [
    "acceptance: real-container end-to-end validation (needs docker/podman; run with -m acceptance)",
]
addopts = "-m 'not acceptance'"

# Ruff — lint + format (Principle VI: one tool for pyflakes/pycodestyle/isort/
# pyupgrade/bugbear + the formatter). `ruff check` and `ruff format --check` both
# gate in CI. E501 is off: doctest expected-output lines can't wrap, and the
# formatter owns real line width anyway. The CLI is the extension-less PEP 723
# script bin/agent-container, so include it explicitly.
[tool.ruff]
line-length = 100
target-version = "py314"
extend-include = ["bin/agent-container"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument as parameter defaults is the canonical Typer idiom, not
# the B008 mutable-default footgun.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.refurb]
# FURB143 (`x or []` is redundant) is a FALSE POSITIVE for our Typer list
# options: they are declared `list[str] = typer.Option(None, ...)`, so at runtime
# an omitted flag is None, not []. `x or []` is a real None-guard, not dead code
# — refurb infers list-ness from the annotation and misses the None default.
ignore = ["FURB143"]

# python-semantic-release — Continuous Deployment (every substantive merge to
# main cuts a release). Strict semver from Conventional Commits: feat -> minor,
# fix -> patch, breaking -> minor while pre-1.0 (major_on_zero = false); docs/
# ci/chore/test/style-only merges cut NO release. Version single-sources here in
# [project].version (PSR bumps it + commits `chore(release): ... [skip ci]`).
# PSR builds the dist (`uv build`); the workflow publishes it to PyPI via OIDC
# Trusted Publishing (Principle III — no stored token). See release.yml.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
major_on_zero = false
allow_zero_version = true
build_command = "uv build"
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.branches.main]
match = "main"

# commitizen — validate Conventional Commit messages (`cz check`). Used by the
# local commit-msg hook (.githooks/) and the CI `commits` job. Enforces the same
# convention python-semantic-release reads to compute releases (Principle VII).
[tool.commitizen]
name = "cz_conventional_commits"

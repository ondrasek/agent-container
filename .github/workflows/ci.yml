# CI for agent-container. The `quality-gate` job runs the SAME script as the
# local Claude Code Stop hook (scripts/quality-gate.sh) — one source of truth for
# "what must pass", so local and CI can't diverge. Locally a failure feeds Claude
# a fix prompt (exit 2); here a failure hard-fails the job. Because publish.yml
# gates on `ci` success, any quality-gate finding blocks the release (Principle
# VII). The remaining jobs add what a single gate run can't: a pinned-interpreter
# pytest run, commit-message validation, the built artifact, and real-container
# acceptance.
name: ci

on:
  # Only run push-triggered CI on main (the release gate). Feature-branch pushes
  # are covered by the `pull_request` event — running BOTH doubled the CI (two
  # concurrent acceptance runs), which is wasteful and was implicated in port-2202
  # flakes when they raced.
  push:
    branches: [main]
  pull_request:

concurrency:
  # Supersede an in-progress PR run when a newer commit is pushed, but NEVER cancel
  # a main run (each merge's CI must complete to gate its release, Principle VII).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install shell-test tools
        # tmux + zsh so the entrypoint-layout and zsh/oh-my-zsh completion suites
        # (run inside the gate) execute their full assertion set, not self-skip.
        run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - name: Quality gate (ruff · ty · bandit · self-test · pytest · shell suites)
        run: scripts/quality-gate.sh

  commits:
    name: conventional commits
    # PRs only: validate the commits the PR introduces. Direct pushes to main are
    # enforced server-side by the repo ruleset (.github/conventional-commits-
    # ruleset.json). commitizen passes merge/revert messages through natively.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: cz check (Conventional Commits)
        # Full fetch of the base (NOT --depth=1): a shallow base ref cannot locate
        # the real merge base once the PR branch has merged main in, so
        # origin/main..HEAD would wrongly include main's own (grandfathered) history.
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          uvx --from commitizen cz check --rev-range "origin/${{ github.base_ref }}..HEAD"

  test:
    name: pytest (py${{ matrix.python }})
    # The gate runs pytest once on the default interpreter; this pins the
    # supported interpreter(s) explicitly. Kept as a matrix so re-widening the
    # support floor later is a one-line change.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run the pytest suite
        run: >
          uv run --no-project --python ${{ matrix.python }} --with pytest
          --with 'pytest-github-actions-annotate-failures>=0.2,<1'
          --with 'typer>=0.12,<1' --with 'questionary>=2.0,<3' --with 'rich>=13,<15' --with 'pyyaml>=6,<7'
          pytest bin/tests

  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build distributions
        run: uv build

  acceptance:
    name: acceptance (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    # BOTH RUNTIMES, EXPLICITLY. The suite honours AGENT_CONTAINER_RUNTIME and
    # otherwise falls back to detect_runtime(), whose order is platform-aware:
    # podman first on Linux, docker first on macOS. So CI covered podman only and
    # a developer's machine covered docker only — neither environment ran both,
    # and nothing said so. That is how a docker-only DNS rule survived months of
    # green builds while being inert under the runtime ADR 0001 makes the DEFAULT.
    #
    # The axis is on THIS job alone: every other job is hermetic and touches no
    # container runtime, so an axis there would double the cost and cover nothing.
    strategy:
      # A runtime-specific failure is the entire point of this axis, so the legs
      # must not cancel each other — fail-fast would let the first failure hide
      # whether the other runtime is also broken, or only that one is.
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      AGENT_CONTAINER_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Verify the docker leg has a usable daemon
        if: matrix.runtime == 'docker'
        # Preinstalled on ubuntu-latest, but ASSERTED rather than assumed: a
        # runtime that is installed is not the same as one that is usable, and a
        # leg that silently degraded would report green for coverage it lost.
        run: |
          set -eux
          docker version --format '{{.Server.Version}}'
          docker ps
      - name: Ensure a podman service, so the podman driver is really covered
        if: matrix.runtime == 'podman'
        # Installed and STARTED explicitly rather than relying on what the runner
        # image happens to contain, so this leg cannot quietly become a no-op when
        # a runner image changes. This step predates the matrix above: it was
        # added because a control-plane image with no podman client once shipped
        # unnoticed, and it is now the setup for the podman leg specifically.
        run: |
          set -eux
          command -v podman || sudo apt-get update -qq && sudo apt-get install -y -qq podman
          podman --version
          systemctl --user enable --now podman.socket 2>/dev/null || \
            (podman system service --time=0 "unix://${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock" &)
          sleep 3
          podman system connection add ci "unix://${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/podman/podman.sock" || true
          podman --connection ci ps
      - name: Run acceptance suite
        # Builds the image and drives real containers through the rootless
        # SSH-identity flows, under the runtime this leg selected —
        # AGENT_CONTAINER_RUNTIME is set at the job level, and the suite reads it
        # in preference to its own detection. `-m acceptance` overrides the
        # default `-m 'not acceptance'` from pyproject. No secrets: the
        # real-agent tests skip themselves without a provider key, naming what
        # goes uncovered.
        run: >
          uv run --no-project --python 3.14 --with pytest
          --with 'pytest-github-actions-annotate-failures>=0.2,<1'
          --with 'typer>=0.12,<1' --with 'questionary>=2.0,<3' --with 'rich>=13,<15' --with 'pyyaml>=6,<7'
          pytest bin/tests -m acceptance

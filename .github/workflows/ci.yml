# CI gate for agent-env: runs the runtime-free pytest suite and builds the
# distributions on every push and PR, so a release tag only ever fires on green.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run the pytest suite
        # --no-project keeps the run hermetic; the --with pins mirror the
        # bin/agent-env PEP 723 inline metadata (kept in sync with pyproject).
        run: >
          uv run --no-project --with pytest
          --with 'typer>=0.12,<1' --with 'questionary>=2.0,<3' --with 'rich>=13,<15'
          pytest bin/tests
      - name: Build distributions
        run: uv build

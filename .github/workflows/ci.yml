# CI gate for agent-container: runs the runtime-free pytest suite and builds the
# distributions on every push and PR. This does NOT run on tag pushes; the
# release itself is gated by publish.yml, which re-runs the suite before build.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs for the same ref so rapid successive pushes don't pile
# up runners (does not dedupe the push/pull_request pair — different refs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Run the pytest suite
        # --no-project keeps the run hermetic; the --with pins mirror the
        # bin/agent-container PEP 723 inline metadata (kept in sync with pyproject).
        run: >
          uv run --no-project --with pytest
          --with 'typer>=0.12,<1' --with 'questionary>=2.0,<3' --with 'rich>=13,<15'
          pytest bin/tests
      - name: Install shell-test tools
        # tmux + zsh so the entrypoint-layout and zsh/oh-my-zsh completion suites
        # run their full assertion set instead of self-skipping.
        run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - name: Run shell test suites
        # These bash suites (entrypoint credential/tmux logic + completions) are
        # NOT collected by pytest, so they must run as their own step or they
        # silently rot. Any non-zero exit fails the job.
        run: |
          bash bin/tests/test_entrypoint.sh
          bash bin/tests/test_entrypoint_tmux_layout.sh
          bash bin/tests/test_completions.sh
      - name: Build distributions
        run: uv build

# Continuous Deployment — every substantive merge to main is released (the CD
# endpoint of the CI/CD ladder). Gated on the FULL ci pipeline: this workflow
# fires via workflow_run only after `ci` concludes successfully on main, so a red
# pipeline never ships (no duplicated test runs).
#
# python-semantic-release reads the Conventional Commits since the last release,
# computes the strict-semver bump (feat -> minor, fix -> patch, breaking -> minor
# while pre-1.0), bumps pyproject.toml [project].version, updates CHANGELOG.md,
# commits `chore(release): X.Y.Z [skip ci]`, tags vX.Y.Z, pushes, and creates the
# GitHub Release + builds the dist. This job then publishes that dist to PyPI via
# OIDC Trusted Publishing (constitution Principle III — no stored token).
# docs/ci/chore/test/style-only merges produce no release.
#
# FILENAME: this file MUST stay `publish.yml`. PyPI's Trusted Publisher for the
# `agent-container` project is bound to (owner: ondrasek, repo: agent-container,
# workflow: publish.yml, environment: release). The OIDC token carries the
# workflow FILENAME as a claim, so renaming this file breaks the publisher match
# (`invalid-publisher`). The in-workflow `name:` below is cosmetic and can differ.
name: release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  # Manual recovery / re-publish: build the version currently in pyproject.toml
  # on main and upload it to PyPI, WITHOUT running semantic-release. Use when a
  # release was tagged + GitHub-released but the PyPI upload failed (e.g. the
  # Trusted Publisher was not yet configured), since PSR will not re-release an
  # already-tagged version. `skip-existing` makes it a safe no-op if the version
  # is already on PyPI.
  workflow_dispatch: {}

# Serialize releases; never cancel one mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic release + publish
    # Fires only when ALL of:
    #   - RELEASE_ENABLED repo variable == 'true' — the one-time "CD armed" switch.
    #     Keep it UNSET until the PyPI Trusted Publisher is configured for this
    #     workflow (publish.yml + `release` environment); otherwise PSR would tag +
    #     create a GitHub Release before the publish step fails, leaving a
    #     half-release. Arm with: gh variable set RELEASE_ENABLED --body true
    #   - the whole ci pipeline passed on main.
    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # PSR: commit the version bump, tag, push, create the GitHub Release
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # PSR needs full history + tags to compute the bump
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Python Semantic Release (version + changelog + tag + GitHub Release)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # THE TAG STATE BEFORE, so the question below is "did THIS RUN release"
          # and not "does HEAD happen to carry a tag".
          #
          # The previous check asked the latter, and it is true for the wrong
          # reason on exactly one commit: the release commit PSR itself creates.
          # A push of that commit starts another run, PSR correctly finds nothing
          # releasable — and the pre-existing tag it made a moment ago satisfied
          # "HEAD carries a v-tag", so publish ran against a `dist` that was never
          # built and failed with "No such file or directory: dist".
          #
          # The result was a red release run after EVERY successful release. That
          # is worse than it sounds: a pipeline that is always red on its own
          # output teaches you to stop reading it, and the next failure that
          # matters arrives looking exactly like the noise.
          before="$(git tag --points-at HEAD | grep '^v' | sort || true)"
          uvx --from python-semantic-release semantic-release version
          after="$(git tag --points-at HEAD | grep '^v' | sort || true)"
          # A release happened iff a NEW v-tag appeared on HEAD during this run.
          if [ "${before}" != "${after}" ]; then
            # AND the artifacts exist. PSR builds them as part of `version`, so
            # their absence means the release did not complete the way this step
            # assumes — and uploading nothing is not a success worth reporting.
            if [ -d dist ] && [ -n "$(ls -A dist 2>/dev/null)" ]; then
              echo "released=true" >> "$GITHUB_OUTPUT"
            else
              echo "released=false" >> "$GITHUB_OUTPUT"
              echo "::error::a new tag appeared but dist/ is empty — refusing to claim a publish"
              exit 1
            fi
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since the last release — nothing to publish."
          fi
      - name: Publish to PyPI (OIDC Trusted Publishing)
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  publish-current:
    name: build + publish current version to PyPI (manual)
    # workflow_dispatch only — build the version in pyproject.toml on main and
    # upload it via the same OIDC Trusted Publishing path, without PSR. For
    # recovering a release whose PyPI upload failed after the tag/GitHub release
    # were already created.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # checkout (declaring `permissions` drops all others to none)
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build distributions
        run: uv build
      - name: Publish to PyPI (OIDC Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true

# compose.yaml — Docker Compose template for local Lima + docker-cli use.
#
# This is an OPTIONAL escape hatch for operators who prefer compose over
# `agent-env`. The canonical path is `agent-env up <name>`, which calls
# `docker run` / `podman run` directly. See docs/orchestration.md.
#
# Usage (from this directory):
#   AGENT_ENV_NAME=alpha AGENT_ENV_PORT=2218 docker compose up -d
#   AGENT_ENV_NAME=alpha docker compose down
#
# Parallel-container safety: every per-container value (name, port, volume)
# is parameterized via AGENT_ENV_NAME / AGENT_ENV_PORT, so running compose twice
# with different env values yields two non-colliding stacks.

services:
  agent-env:
    build:
      context: ../
      dockerfile: Dockerfile
    image: localhost/agent-env:latest
    container_name: "agent-env-${AGENT_ENV_NAME:-default}"
    env_file:
      - ../.env
    ports:
      - "${AGENT_ENV_PORT:-2200}:22"
    volumes:
      - "agent-env-${AGENT_ENV_NAME:-default}-workspace:/workspace"
    restart: unless-stopped

volumes:
  # Compose expands ${AGENT_ENV_NAME} at parse time, so each invocation
  # creates a distinct named volume. The volume survives `compose down`.
  agent-env-${AGENT_ENV_NAME:-default}-workspace:
    name: "agent-env-${AGENT_ENV_NAME:-default}-workspace"

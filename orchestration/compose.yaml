# compose.yaml — Docker Compose template for local Lima + docker-cli use.
#
# This is an OPTIONAL escape hatch for operators who prefer compose over
# `agent-container`. The canonical path is `agent-container up <name>`, which calls
# `docker run` / `podman run` directly. See docs/orchestration.md.
#
# Usage (from this directory):
#   AGENT_CONTAINER_NAME=alpha AGENT_CONTAINER_PORT=2218 docker compose up -d
#   AGENT_CONTAINER_NAME=alpha docker compose down
#
# Per-container env file (optional): point AGENT_CONTAINER_ENV_FILE at a distinct
# .env so two parallel stacks can carry different GH_TOKEN / git identities:
#   AGENT_CONTAINER_NAME=alpha AGENT_CONTAINER_ENV_FILE=../alpha.env docker compose up -d
#
# Parallel-container safety: every per-container value (name, port, volumes,
# env file) is parameterized, so running compose twice with different env values
# yields two fully non-colliding stacks.
#
# Volume parity with the CLI: this template mounts the SAME nine per-container
# named volumes that `agent-container up` mounts (workspace + the agent config /
# shell-env / tmux config dirs + ~/.ssh), so interactive `claude login` /
# `codex login` / `opencode auth login`, `~/.agent-container/env`, `~/.config/tmux`,
# and the SSH identity (host key + authorized_keys) persist across `down`/`up` on
# this path too. opencode has TWO volumes: it follows XDG and splits configuration
# (~/.config/opencode) from credentials + session history (~/.local/share/opencode).
# This list is kept in sync with `all_volume_mounts()` in bin/agent-container by a
# test (bin/tests/test_pure_logic.py) — these templates are hand-maintained, so
# nothing else would catch drift.
#
# The container is rootless (sshd runs as dev on port 2222); the host port is
# operator-chosen, mapped to 2222.

services:
  agent-container:
    build:
      context: ../
      dockerfile: Dockerfile
    image: localhost/agent-container:latest
    container_name: "agent-container-${AGENT_CONTAINER_NAME:-default}"
    env_file:
      - "${AGENT_CONTAINER_ENV_FILE:-../.env}"
    ports:
      - "${AGENT_CONTAINER_PORT:-2200}:2222"
    volumes:
      - "agent-container-${AGENT_CONTAINER_NAME:-default}-workspace:/workspace"
      - "agent-container-${AGENT_CONTAINER_NAME:-default}-claude:/home/dev/.claude"
      - "agent-container-${AGENT_CONTAINER_NAME:-default}-codex:/home/dev/.codex"
      - "agent-container-${AGENT_CONTAINER_NAME:-default}-pi:/home/dev/.pi"
      - "agent-container-${AGENT_CONTAINER_NAME:-default}-opencode:/home/dev/.config/opencode"
      - "agent-container-${AGENT_CONTAINER_NAME:-default}-opencode-data:/home/dev/.local/share/opencode"
      - "agent-container-${AGENT_CONTAINER_NAME:-default}-shellenv:/home/dev/.agent-container"
      - "agent-container-${AGENT_CONTAINER_NAME:-default}-tmux:/home/dev/.config/tmux"
      - "agent-container-${AGENT_CONTAINER_NAME:-default}-ssh:/home/dev/.ssh"
    # unless-stopped: an always-on dev box should come back after a host reboot
    # or daemon restart, but stay down when the operator explicitly stops it.
    restart: unless-stopped

# Compose expands ${AGENT_CONTAINER_NAME} at parse time, so each invocation
# creates a distinct set of named volumes. They survive `compose down` and are
# removed only by `compose down -v` (the CLI's `down --purge` equivalent).
volumes:
  agent-container-${AGENT_CONTAINER_NAME:-default}-workspace:
    name: "agent-container-${AGENT_CONTAINER_NAME:-default}-workspace"
  agent-container-${AGENT_CONTAINER_NAME:-default}-claude:
    name: "agent-container-${AGENT_CONTAINER_NAME:-default}-claude"
  agent-container-${AGENT_CONTAINER_NAME:-default}-codex:
    name: "agent-container-${AGENT_CONTAINER_NAME:-default}-codex"
  agent-container-${AGENT_CONTAINER_NAME:-default}-pi:
    name: "agent-container-${AGENT_CONTAINER_NAME:-default}-pi"
  agent-container-${AGENT_CONTAINER_NAME:-default}-opencode:
    name: "agent-container-${AGENT_CONTAINER_NAME:-default}-opencode"
  agent-container-${AGENT_CONTAINER_NAME:-default}-opencode-data:
    name: "agent-container-${AGENT_CONTAINER_NAME:-default}-opencode-data"
  agent-container-${AGENT_CONTAINER_NAME:-default}-shellenv:
    name: "agent-container-${AGENT_CONTAINER_NAME:-default}-shellenv"
  agent-container-${AGENT_CONTAINER_NAME:-default}-tmux:
    name: "agent-container-${AGENT_CONTAINER_NAME:-default}-tmux"
  agent-container-${AGENT_CONTAINER_NAME:-default}-ssh:
    name: "agent-container-${AGENT_CONTAINER_NAME:-default}-ssh"
